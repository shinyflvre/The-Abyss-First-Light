plugins {
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric"
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

tasks.named('processResources', ProcessResources) {
    dependsOn configurations.commonResources
    from(configurations.commonResources) {
        exclude '**/*.bbmodel'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    def props = [
            version              : mod_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_description      : mod_description,
            mod_authors          : mod_authors,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            geckolib_version     : geckolib_version,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

sourceSets {
    check {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        theabyss {
            sourceSet sourceSets.main
        }
        theabyss_check {
            sourceSet sourceSets.check
        }
    }

    runs {
        client {
            client()
            runDir = '../run-fabric'
        }
        server {
            server()
            runDir = '../run-fabric-server'
            programArgs '--nogui'
        }
        checkServer {
            server()
            source sourceSets.check
            runDir = '../run-check/fabric-server'
            programArgs '--nogui'
            ideConfigGenerated false
        }
        checkClient {
            client()
            source sourceSets.check
            runDir = '../run-check/fabric-client'
            programArgs '--quickPlaySingleplayer', 'check'
            vmArg '-Dtheabyss.check=true'
            ideConfigGenerated false
        }
    }
}

tasks.register('writeCompileClasspath') {
    def cp = sourceSets.main.compileClasspath
    def out = layout.buildDirectory.file('compileClasspath.txt')
    inputs.files(cp)
    outputs.file(out)
    doLast {
        out.get().asFile.text = cp.files.collect { it.absolutePath }.join('\n')
    }
}

tasks.matching { it.name == 'runServer' || it.name == 'runCheckServer' }.configureEach { standardInput = System.in }
