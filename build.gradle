plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'java-library'

    version = mod_version
    group = mod_group_id

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository { maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }
            filter { includeGroup 'com.geckolib'; includeGroup 'software.bernie.geckolib' }
        }
        exclusiveContent {
            forRepository { maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com/' } }
            filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
        }
        exclusiveContent {
            forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
        exclusiveContent {
            forRepository { maven { name = 'Fuzs Mod Resources'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } }
            filter { includeGroup 'fuzs.forgeconfigapiport' }
        }
        exclusiveContent {
            forRepository { maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' } }
            filter { includeGroup 'net.fabricmc'; includeGroup 'net.fabricmc.fabric-api' }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        options.compilerArgs << '-Xmaxerrs' << '100000'
    }
}
