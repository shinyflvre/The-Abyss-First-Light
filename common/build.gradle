plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = 'theabyss-common'
}

neoForge {
    neoFormVersion = project.neo_form_version
}

dependencies {
    compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    compileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forgeconfigapiport_version}"
    compileOnly "com.geckolib:geckolib-common-${minecraft_version}:${geckolib_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
}

sourceSets.main.resources {
    exclude('**/*.bbmodel')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

tasks.register('writeCompileClasspath') {
    def cp = sourceSets.main.compileClasspath
    def out = layout.buildDirectory.file('compileClasspath.txt')
    inputs.files(cp)
    outputs.file(out)
    doLast {
        out.get().asFile.text = cp.files.collect { it.absolutePath }.join('\n')
    }
}
